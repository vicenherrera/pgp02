# --------------------------------
# Pgpool-II 4.6 configuration file
# --------------------------------
#

backend_clustering_mode = 'streaming_replication'


auth_method = 'scram-sha-256'
pool_passwd_file = '/etc/pgpool2/pool_passwd'


listen_addresses = '*'
port = 9999

socket_dir = '/var/run/pgpool2'

failover_when_quorum_exists = off

pid_file_name = '/var/run/pgpool2/pgpool.pid'
status_file_path = '/var/run/pgpool2/pgpool_status'


log_destination = 'stderr' # O 'syslog' si prefieres
logging_collector = on
log_directory = '/var/log/pgpool2' # Directorio para logs de Pgpool-II
log_filename = 'pgpool.log' # Nombre del archivo de log

pcp_listen_addresses = '*'
pcp_port = 9898
pcp_socket_dir = '/var/run/pgpool2'
enable_pool_hba = on


backend_hostname0 = '172.16.1.238'
backend_port0 = 5432
backend_weight0 = 1                   # Peso para balanceo de carga. El maestro puede tener un peso bajo/0 para solo escrituras.
backend_data_directory0 = '/data/main'
backend_flag0 = 'ALLOW_TO_FAILOVER' # Indica que es el primario

backend_hostname1 = '172.16.1.239'
backend_port1 = 5432
backend_weight1 = 1                   # Para balanceo de lectura, si quieres.
backend_data_directory1 = '/data/main'
backend_flag1 = 'ALLOW_TO_FAILOVER' # Indica que es un standby

backend_hostname2 = '172.16.1.240'
backend_port2 = 5432
backend_weight2 = 1                   # Para balanceo de lectura, si quieres.
backend_data_directory2 = '/data/main'
backend_flag2 = 'ALLOW_TO_FAILOVER' # Indica que es un standby

num_init_children = 32                # Número inicial de procesos Pgpool-II
max_pool = 4                          # Máximo de conexiones por proceso hijo
connection_cache = on
load_balance_mode = on                # Habilita balanceo de carga para sentencias SELECT
replication_mode = off                 # Habilita modo de replicación (para streaming replication nativa)
sr_check_period = 10                  # Frecuencia de verificación del estado de replicación (segundos)
sr_check_user = 'pgpooluser'
sr_check_password = 'PgpU53r-0902'
sr_check_database = 'postgres'

health_check_period = 5               # Frecuencia de verificación de salud del backend (segundos)
health_check_user = 'pgpooluser'
health_check_password = 'PgpU53r-0902'


delay_threshold = 1000000             # Umbral de retraso para el balanceo de carga (microsegundos).

failover_on_backend_error = on        # Habilita failover automático
failover_command = '/etc/pgpool2/failover.sh %d %h %P %D %m %H %M %R'
# failback_command = '/etc/pgpool2/failback.sh %d %h %P %D %m %H %M %R' # Opcional: para traer un nodo de vuelta


heartbeat_hostname0 = 'pgp-master'
heartbeat_device0 = ''
#heartbeat_destination0 = '172.16.1.239'
heartbeat_port0 = 9694

heartbeat_hostname1 = 'pgp01'
heartbeat_device1 = ''
#heartbeat_destination1 = '172.16.1.240'
heartbeat_port1 = 9694

heartbeat_hostname2 = 'pgp02'
heartbeat_device2 = ''
#heartbeat_destination1 = '172.16.1.240'
heartbeat_port2 = 9694



#heartbeat_hostname0 = 'pgp-master'
#heartbeat_device0 = ''  # vacío si quieres autodetección
#heartbeat_destination0 = '172.16.1.239'  # IP del siguiente nodo (pgp01)
#heartbeat_port0 = 9694

#heartbeat_hostname1 = 'pgp-master'
#heartbeat_device1 = ''
#heartbeat_destination1 = '172.16.1.240'  # IP del otro nodo (pgp02)
#heartbeat_port1 = 9694


wd_hostname = '172.16.1.240'
wd_port0 = 9000
wd_interval = 5
wd_heartbeat_keepalive = 2
wd_heartbeat_dead_threshold = 10
wd_socket_dir = '/var/run/pgpool2'
wd_heartbeat_device = 'ens160' 
wd_ipc_socket_dir = '/var/run/pgpool2'

peer_hostname0 = '172.16.1.238' # IP del pgp-master
peer_port0 = 9999
peer_wd_port0 = 9000

peer_hostname1 = '172.16.1.239' # IP del pgp01
peer_port1 = 9999
peer_wd_port1 = 9000

wd_priority = 80 # Prioridad menor para pgp02
delegate_ip = '172.16.1.237'
if_up_cmd = '/usr/bin/sudo /sbin/ip addr add 172.16.1.237/24 dev ens160'
if_down_cmd = '/usr/bin/sudo /sbin/ip addr del 172.16.1.237/24 dev ens160'
arping_cmd = '/usr/bin/sudo /usr/sbin/arping -U 172.16.1.237 -I ens160'
use_watchdog = on

arping_cmd = '/usr/bin/sudo /usr/sbin/arping -U 172.16.1.237 -I ens160'



# --- Watchdog Cluster Members ---
# Nodo 0 - pgp-master
 hostname0 = 'pgp-master'
 wd_ip0 = '172.16.1.238'
 pgpool_port0 = 9999
 wd_port0 = 9000
#
 # Nodo 1 - 
 hostname1 = 'pgp01'
 wd_ip1 = '172.16.1.239'
 pgpool_port1 = 9999
 wd_port1 = 9000
#
# Nodo 2 - pgp02
 hostname2 = 'pgp02'
 wd_ip2 = '172.16.1.240'
 pgpool_port2 = 9999
 wd_port2 = 9000


memqcache_lockfile = '/var/log/pgpool2/memq_lock_file'
memqcache_enable = off


auto_failback = on


# application_name mapping
backend_application_name0 = 'pgp-master'
backend_application_name1 = 'pgp01'
backend_application_name2 = 'pgp02'

