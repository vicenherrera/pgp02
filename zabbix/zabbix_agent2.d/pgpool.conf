#########################################################
### SERVICIO PGPOOL-II
###########################################################
##
UserParameter=pgpool.status,systemctl is-active --quiet pgpool2; echo $?
##
###########################################################
### PROCESOS PGPOOL
###########################################################
##
UserParameter=pgpool.processes,pgrep -fc pgpool
##
###########################################################
### VIP PRESENTE
###########################################################
##
UserParameter=pgpool.vip,ip addr | grep -c 172.16.1.237
##
###########################################################
### WATCHDOG MASTER
###########################################################
##
UserParameter=pgpool.watchdog.master,/usr/sbin/pcp_watchdog_info -h localhost -U pgpool -w | awk -v h=$(hostname -s) '$0 ~ h && $0 ~ /LEADER/ {print 1; found=1} END {if (!found) print 0}'
##
###########################################################
### WATCHDOG NODOS ALIVE
###########################################################
##
UserParameter=pgpool.watchdog.alive,/usr/sbin/pcp_watchdog_info -h localhost -U pgpool -w | grep -Ec "LEADER|STANDBY"
##
###########################################################
### BACKEND NODE 0 STATUS
###########################################################
##
UserParameter=pgpool.node0.status,/usr/sbin/pcp_node_info -h localhost -U pgpool -w 0 | awk '{print $6}'
##
###########################################################
### BACKEND NODE 1 STATUS
###########################################################
##
UserParameter=pgpool.node1.status,/usr/sbin/pcp_node_info -h localhost -U pgpool -w 1 | awk '{print $6}'
##
###########################################################
### BACKEND NODE 2 STATUS
###########################################################
##
UserParameter=pgpool.node2.status,/usr/sbin/pcp_node_info -h localhost -U pgpool -w 2 | awk '{print $6}'
##
###########################################################
### CANTIDAD REAL DE NODOS UP
###########################################################
##
UserParameter=pgpool.nodes.up,/usr/sbin/pcp_node_info -h localhost -U pgpool -w | grep -c " up "
##
###########################################################
### HEALTH CHECK FAILURES
###########################################################
##
#
UserParameter=pgpool.health.node0.status,/usr/sbin/pcp_health_check_stats -h localhost -U pgpool -w -n 0 | awk '{print $4}'
UserParameter=pgpool.health.node0.retries,/usr/sbin/pcp_health_check_stats -h localhost -U pgpool -w -n 0 | awk '{print $10}'
UserParameter=pgpool.health.node0.failures,/usr/sbin/pcp_health_check_stats -h localhost -U pgpool -w -n 0 | awk '{print $9}'
#
UserParameter=pgpool.health.node1.status,/usr/sbin/pcp_health_check_stats -h localhost -U pgpool -w -n 1 | awk '{print $4}'
UserParameter=pgpool.health.node1.retries,/usr/sbin/pcp_health_check_stats -h localhost -U pgpool -w -n 1 | awk '{print $10}'
UserParameter=pgpool.health.node1.failures,/usr/sbin/pcp_health_check_stats -h localhost -U pgpool -w -n 1 | awk '{print $9}'
#
UserParameter=pgpool.health.node2.status,/usr/sbin/pcp_health_check_stats -h localhost -U pgpool -w -n 2 | awk '{print $4}'
UserParameter=pgpool.health.node2.retries,/usr/sbin/pcp_health_check_stats -h localhost -U pgpool -w -n 2 | awk '{print $10}'
UserParameter=pgpool.health.node2.failures,/usr/sbin/pcp_health_check_stats -h localhost -U pgpool -w -n 2 | awk '{print $9}'
#
#
#
##
###########################################################
### POSTGRESQL EN RECOVERY
###########################################################
##
UserParameter=pgsql.is_recovery,sudo -u postgres psql -Atq -c "SELECT CASE WHEN pg_is_in_recovery() THEN 1 ELSE 0 END;"
##
###########################################################
### REPLICATION LAG
###########################################################
##
UserParameter=pgsql.replication.lag,sudo -u postgres psql -t -c "SELECT COALESCE(EXTRACT(EPOCH FROM now()-pg_last_xact_replay_timestamp())::INT,0);"
##
###########################################################
### REPLICAS CONECTADAS
###########################################################
##
UserParameter=pgsql.replication.backends,sudo -u postgres psql -t -c "SELECT count(*) FROM pg_stat_replication;"
#
###########################################################
### CONEXIONES ACTIVAS
###########################################################
##
UserParameter=pgsql.connections2,sudo -u postgres psql -t -c "SELECT count(*) FROM pg_stat_activity;"
##
###########################################################
### BASES DE DATOS
###########################################################
##
UserParameter=pgsql.databases,sudo -u postgres psql -t -c "SELECT count(*) FROM pg_database;"
##
###########################################################
### TAMAÑO TOTAL DE BASES
###########################################################
##
UserParameter=pgsql.db.size2,sudo -u postgres psql -t -c "SELECT pg_database_size('postgres');"
##
###########################################################
### DEADLOCKS
###########################################################
##
UserParameter=pgsql.deadlocks,sudo -u postgres psql -t -c "SELECT sum(deadlocks) FROM pg_stat_database;"
##
###########################################################
### CACHE HIT RATIO
###########################################################
##
UserParameter=pgsql.cache.hit2,sudo -u postgres psql -t -c "SELECT round(sum(blks_hit)*100/sum(blks_hit+blks_read),2) FROM pg_stat_database;"
##
###########################################################
### TRANSACTIONS PER SECOND
###########################################################
##
UserParameter=pgsql.transactions,sudo -u postgres psql -t -c "SELECT sum(xact_commit+xact_rollback) FROM pg_stat_database;"
